# .github/workflows/ci.yml
# -------------------------
# Pipeline CI/CD do projeto fraud-detection.
# Projeto GCP: bankfraud-491117
#
# Triggers:
#   - Push em main ou develop
#   - Pull Request para main
#
# Jobs:
#   1. quality   — lint (flake8) + type check (mypy)
#   2. tests     — pytest com coverage
#   3. deploy    — envia DAGs para GCS e notifica (apenas main)

name: Fraud Detection CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  GCP_PROJECT: "bankfraud-491117"

jobs:

  # ── 1. Qualidade de Codigo ─────────────────────────────────────────────────
  quality:
    name: Qualidade de Codigo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias de qualidade
        run: |
          pip install flake8 mypy pandas-stubs

      - name: Lint — flake8
        run: |
          flake8 src/ \
            --max-line-length=100 \
            --exclude=__pycache__,.venv \
            --statistics
        continue-on-error: false

      - name: Type check — mypy
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --no-strict-optional
        continue-on-error: true   # mypy e informativo, nao bloqueia


  # ── 2. Testes Automatizados ────────────────────────────────────────────────
  tests:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias do projeto
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Criar estrutura de pastas necessaria
        run: |
          mkdir -p data/raw/ulb data/raw/ieee data/raw/sparkov
          mkdir -p data/processed models reports/figures

      - name: Rodar testes unitarios
        run: |
          pytest tests/ \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload cobertura para Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true


  # ── 3. Deploy (apenas branch main) ────────────────────────────────────────
  deploy:
    name: Deploy para GCP
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy DAGs para Cloud Storage
        run: |
          gsutil -m cp dags/*.py gs://${{ secrets.AIRFLOW_BUCKET }}/dags/
          echo "DAGs enviadas para gs://${{ secrets.AIRFLOW_BUCKET }}/dags/"

      - name: Deploy scripts src/ para Cloud Storage
        run: |
          gsutil -m rsync -r src/ gs://${{ secrets.AIRFLOW_BUCKET }}/src/
          echo "Scripts src/ sincronizados."

      - name: Resumo do deploy
        run: |
          echo "Deploy concluido!"
          echo "Projeto  : ${{ env.GCP_PROJECT }}"
          echo "Bucket   : ${{ secrets.AIRFLOW_BUCKET }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Branch   : ${{ github.ref_name }}"